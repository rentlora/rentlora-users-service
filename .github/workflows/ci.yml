name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read
  security-events: write

env:
  SERVICE: rentlora-user-service
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  ci:
    name: CI and security
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Enforce develop-to-main PRs
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "ERROR: You can only merge into main from the develop branch."
            exit 1
          fi

      - name: Checkout service repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python compile check
        run: python -m compileall src

      - name: SonarCloud scan
        if: env.SONAR_TOKEN != '' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request')
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: SonarCloud quality gate
        if: env.SONAR_TOKEN != '' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request')
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Snyk dependency scan
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}
        with:
          args: --severity-threshold=critical --sarif-file-output=snyk.sarif

      - name: Upload Snyk SARIF
        if: always() && env.SNYK_TOKEN != '' && hashFiles('snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif
          category: snyk-${{ env.SERVICE }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy filesystem SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs-${{ env.SERVICE }}

      - name: Fail on critical filesystem vulnerabilities
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

  notify-failure:
    name: Notify CI failure
    runs-on: ubuntu-latest
    needs: ci
    if: failure()

    steps:
      - name: Checkout service repo
        uses: actions/checkout@v4

      - name: Notify failed run
        if: env.SLACK_WEBHOOK_URL != ''
        uses: ./.github/actions/slack-notify
        with:
          status: failed
          pipeline: CI
          job_name: ci
          service_name: ${{ env.SERVICE }}
          error_message: CI/security checks failed.
          slack_webhook_url: ${{ env.SLACK_WEBHOOK_URL }}
