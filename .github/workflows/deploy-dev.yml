name: Deploy Dev

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  packages: write
  security-events: write

env:
  SERVICE: rentlora-user-service
  IMAGE_NAME: ghcr.io/rentlora/rentlora-user-service
  HELM_REPO: rentlora/rentlora-helm
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  deploy-dev:
    name: Build, scan, deploy dev
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout service repo
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=sha-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Notify develop deploy started
        if: env.SLACK_WEBHOOK_URL != ''
        uses: ./.github/actions/slack-notify
        with:
          status: success
          pipeline: Deploy Dev
          job_name: deploy-dev
          service_name: ${{ env.SERVICE }}
          docker_image: ${{ env.IMAGE_NAME }}
          docker_tag: ${{ env.IMAGE_TAG }}
          message: |
            Develop deployment started.
            Building and scanning image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          slack_webhook_url: ${{ env.SLACK_WEBHOOK_URL }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ env.SERVICE }}

      - name: Fail on critical image vulnerabilities
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout Helm repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HELM_REPO }}
          token: ${{ secrets.GIT_TOKEN }}
          path: _helm

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Update dev Helm values
        run: |
          FILE="${SERVICE}/values-dev.yaml"
          yq e ".image.tag = \"${IMAGE_TAG}\"" -i "_helm/${FILE}"
          cd _helm
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${FILE}"
          git diff --staged --quiet && exit 0
          git commit -m "ci(${SERVICE}): deploy ${IMAGE_TAG} to dev [skip ci]"
          git push origin main

      - name: Notify develop deploy success
        if: success() && env.SLACK_WEBHOOK_URL != ''
        uses: ./.github/actions/slack-notify
        with:
          status: success
          pipeline: Deploy Dev
          job_name: deploy-dev
          service_name: ${{ env.SERVICE }}
          docker_image: ${{ env.IMAGE_NAME }}
          docker_tag: ${{ env.IMAGE_TAG }}
          message: |
            Develop deployment completed.
            Image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          slack_webhook_url: ${{ env.SLACK_WEBHOOK_URL }}

  notify-failure:
    name: Notify dev deploy failure
    runs-on: ubuntu-latest
    needs: deploy-dev
    if: failure()

    steps:
      - name: Checkout service repo
        uses: actions/checkout@v4

      - name: Notify failed run
        if: env.SLACK_WEBHOOK_URL != ''
        uses: ./.github/actions/slack-notify
        with:
          status: failed
          pipeline: Deploy Dev
          job_name: deploy-dev
          service_name: ${{ env.SERVICE }}
          error_message: Dev deployment failed.
          slack_webhook_url: ${{ env.SLACK_WEBHOOK_URL }}
