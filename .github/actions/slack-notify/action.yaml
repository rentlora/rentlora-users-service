name: Notify Slack and Gmail
description: "Send deployment/pipeline notifications"

inputs:
  status:
    required: true
    description: "'success' | 'failed'"
  pipeline:
    required: true
    description: "Pipeline name"
  job_name:
    required: true
    description: "Logical job label key"
  service_name:
    required: false
    default: ""
  message:
    required: false
    default: ""
  error_message:
    required: false
    default: "Check the GitHub Actions run for details."
  docker_image:
    required: false
    default: ""
  docker_tag:
    required: false
    default: ""
  slack_webhook_url:
    required: true
  gmail_username:
    required: false
    default: ""
  gmail_app_password:
    required: false
    default: ""
  notify_email_to:
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Resolve context
      id: ctx
      shell: bash
      run: |
        STATUS="${{ inputs.status }}"
        JOB="${{ inputs.job_name }}"
        SERVICE="${{ inputs.service_name }}"
        CUSTOM_MESSAGE="$(cat <<'EOF_CUSTOM_MESSAGE'
        ${{ inputs.message }}
        EOF_CUSTOM_MESSAGE
        )"
        ERROR_MESSAGE="$(cat <<'EOF_ERROR_MESSAGE'
        ${{ inputs.error_message }}
        EOF_ERROR_MESSAGE
        )"
        SERVICE_LABEL="${SERVICE:+[$SERVICE] }"

        if [ "$STATUS" = "success" ]; then
          echo "status_word=SUCCESS" >> "$GITHUB_OUTPUT"
          echo "color=#2EB67D" >> "$GITHUB_OUTPUT"
        else
          echo "status_word=FAILED" >> "$GITHUB_OUTPUT"
          echo "color=#E01E5A" >> "$GITHUB_OUTPUT"
        fi

        case "$JOB" in
          ci)              LABEL="${SERVICE_LABEL}CI and Security" ;;
          deploy-dev)      LABEL="${SERVICE_LABEL}Deploy to Dev" ;;
          release-awaiting)LABEL="${SERVICE_LABEL}Release Awaiting Approval" ;;
          release-prod)    LABEL="${SERVICE_LABEL}Release to Prod" ;;
          all)             LABEL="${SERVICE_LABEL}Pipeline Summary" ;;
          *)               LABEL="${SERVICE_LABEL}${JOB}" ;;
        esac
        echo "job_label=$LABEL" >> "$GITHUB_OUTPUT"

        if [ -n "$CUSTOM_MESSAGE" ]; then
          DETAIL="$CUSTOM_MESSAGE"
        elif [ "$STATUS" = "success" ]; then
          if [ -n "${{ inputs.docker_image }}" ] && [ -n "${{ inputs.docker_tag }}" ]; then
            DETAIL="Image: ${{ inputs.docker_image }}:${{ inputs.docker_tag }}"
          else
            DETAIL="$LABEL completed successfully."
          fi
        else
          DETAIL="$ERROR_MESSAGE"
        fi

        DETAIL_ESC="${DETAIL//$'\n'/\\n}"
        echo "detail=$DETAIL_ESC" >> "$GITHUB_OUTPUT"

    - name: Send Slack notification
      uses: slackapi/slack-github-action@v1.27.0
      with:
        payload: |
          {
            "text": "${{ steps.ctx.outputs.status_word }} - ${{ steps.ctx.outputs.job_label }}",
            "attachments": [
              {
                "color": "${{ steps.ctx.outputs.color }}",
                "blocks": [
                  {
                    "type": "header",
                    "text": {
                      "type": "plain_text",
                      "text": "${{ steps.ctx.outputs.status_word }} - ${{ steps.ctx.outputs.job_label }}"
                    }
                  },
                  {
                    "type": "section",
                    "fields": [
                      { "type": "mrkdwn", "text": "*Repository:*\n${{ github.repository }}" },
                      { "type": "mrkdwn", "text": "*Branch/Ref:*\n${{ github.ref_name }}" },
                      { "type": "mrkdwn", "text": "*Run:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_number }}>" }
                    ]
                  },
                  { "type": "divider" },
                  {
                    "type": "section",
                    "text": { "type": "mrkdwn", "text": "${{ steps.ctx.outputs.detail }}" }
                  }
                ]
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.slack_webhook_url }}
        SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

    - name: Send Gmail notification
      if: inputs.gmail_username != '' && inputs.notify_email_to != ''
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: ${{ inputs.gmail_username }}
        password: ${{ inputs.gmail_app_password }}
        to: ${{ inputs.notify_email_to }}
        from: "GitHub Actions <${{ inputs.gmail_username }}>"
        subject: >
          [${{ inputs.pipeline }}] ${{ steps.ctx.outputs.status_word }} - ${{ steps.ctx.outputs.job_label }}
        body: |
          Status     : ${{ steps.ctx.outputs.status_word }}
          Job        : ${{ steps.ctx.outputs.job_label }}
          Repository : ${{ github.repository }}
          Ref        : ${{ github.ref_name }}
          Run        : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Details:
          ${{ steps.ctx.outputs.detail }}
